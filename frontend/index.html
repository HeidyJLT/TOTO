<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente Virtual TOTO · Campus Virtual Bucaramanga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:        #1E2A7B;
    --navy-oscuro: #172060;
    --crema:       #FFFDF1;
    --morado:      #9E71C6;
    --morado-alto: #B58EDA;
    --lavanda:     #8084B4;
    --burbuja-ia:  #BEE5F6;
    --burbuja-yo:  #BEBFD3;
    --tinta:       #23263F;
    --tinta-suave: #5B5F7D;
    --blanco:      #FFFFFF;
    --alerta:      #C0392B;
    --alerta-fondo:#FBE6E3;
    --acento:       var(--navy);
    --acento-fondo: rgba(30, 42, 124, .08);
    --acento-borde: rgba(30, 42, 124, .16);
    --acento-tenue: rgba(30, 42, 124, .03);
    --fuente: 'Montserrat', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(10px, 2.6vw, 34px);
    background: #EDEFF6;
    font-family: var(--fuente);
    color: var(--tinta);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 1040px;
    height: min(86vh, 740px);
    min-height: 520px;
    display: flex;
    flex-direction: column;
    background: var(--crema);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 26px 60px -18px rgba(30, 42, 124, .34);
  }

  /* ── Cabecera ───────────────────────────────────── */

  header {
    position: relative;
    background: var(--navy);
    color: var(--blanco);
    padding: 22px 26px 20px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
  }

  .estado {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 10.5px;
    font-weight: 500;
    color: rgba(255, 255, 255, .62);
    min-width: 0;
  }
  .estado span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #statusDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .45);
    flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  #statusDot.online  { background: #5FE0A8; box-shadow: 0 0 0 3px rgba(95, 224, 168, .22); }
  #statusDot.offline { background: #FF8A7A; box-shadow: 0 0 0 3px rgba(255, 138, 122, .22); }

  .titulos { text-align: center; }
  .titulos h1 {
    margin: 0;
    font-size: clamp(19px, 2.5vw, 27px);
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .titulos p {
    margin: 4px 0 0;
    font-size: clamp(11px, 1.3vw, 14px);
    font-weight: 600;
    color: rgba(255, 255, 255, .88);
  }

  .zona-marca {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }
  .marca { height: 62px; width: auto; }

  .engranaje {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, .12);
    color: rgba(255, 255, 255, .8);
    cursor: pointer;
    flex-shrink: 0;
    transition: background .2s;
  }
  .engranaje:hover { background: rgba(255, 255, 255, .24); }

  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  :focus-visible { outline: 2px solid var(--morado); outline-offset: 2px; }

  /* ── Ajustes ────────────────────────────────────── */

  .ajustes {
    display: none;
    flex-direction: column;
    gap: 11px;
    padding: 16px 26px;
    background: #F1EEE2;
    border-bottom: 1px solid rgba(30, 42, 124, .1);
  }
  .ajustes.open { display: flex; }

  .fila { display: flex; gap: 10px; align-items: flex-end; }
  .campo { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .campo label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--tinta-suave);
  }
  .campo input {
    font-family: var(--fuente);
    font-size: 13px;
    padding: 9px 12px;
    border: 1px solid rgba(30, 42, 124, .18);
    border-radius: 9px;
    background: var(--blanco);
    color: var(--tinta);
  }
  .campo input:read-only { color: var(--tinta-suave); }

  .boton {
    font-family: var(--fuente);
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 9px;
    border: none;
    background: var(--navy);
    color: var(--blanco);
    cursor: pointer;
    white-space: nowrap;
  }
  .boton.suave { background: rgba(30, 42, 124, .1); color: var(--navy); }

  /* ── Accesos rápidos ────────────────────────────── */

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 11px;
    padding: 20px 30px 6px;
  }
  .chip {
    font-family: var(--fuente);
    font-size: 13px;
    font-weight: 500;
    color: var(--blanco);
    background: var(--morado);
    border: none;
    border-radius: 999px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background .18s, transform .18s;
  }
  .chip:hover { background: var(--morado-alto); transform: translateY(-1px); }

  /* ── Conversación ───────────────────────────────── */

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 18px 30px 26px;
    padding-right: 268px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(30, 42, 124, .2) transparent;
  }
  .log::-webkit-scrollbar { width: 7px; }
  .log::-webkit-scrollbar-thumb { background: rgba(30, 42, 124, .2); border-radius: 4px; }

  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 92%; }
  .msg.user   { align-self: flex-end; align-items: flex-end; }
  .msg.agent  { align-self: flex-start; align-items: flex-start; }
  .msg.system { align-self: center; max-width: 100%; align-items: center; }

  .bubble {
    font-size: 14.5px;
    line-height: 1.6;
    padding: 17px 22px;
    border-radius: 20px;
    overflow-wrap: anywhere;
  }
  .msg.agent  .bubble { background: var(--burbuja-ia); color: var(--tinta); border-bottom-left-radius: 7px; }
  .msg.user   .bubble { background: var(--burbuja-yo); color: var(--tinta); border-bottom-right-radius: 7px; }
  .msg.system .bubble {
    background: var(--alerta-fondo);
    color: var(--alerta);
    font-size: 12.5px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 12px;
  }

  .bubble p { margin: 0; }
  .bubble p + p, .bubble ul { margin-top: 11px; }
  .bubble h4 {
    margin: 20px 0 0;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--acento);
  }
  .bubble h4:first-child { margin-top: 0; }
  .bubble ul { margin-bottom: 0; padding-left: 2px; list-style: none; }
  .bubble li { position: relative; padding-left: 18px; margin-top: 6px; }
  .bubble li::before { content: '·'; position: absolute; left: 3px; font-weight: 700; color: var(--acento); }
  .bubble code {
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: .88em;
    background: var(--acento-fondo);
    padding: 2px 6px;
    border-radius: 5px;
  }
  .bubble strong { font-weight: 700; color: var(--acento); }
  .bubble em { font-style: italic; }

  .bubble blockquote {
    margin: 11px 0 0;
    padding: 8px 14px;
    background: var(--acento-fondo);
    border-left: 3px solid var(--acento);
    font-style: italic;
  }

  .bubble hr {
    margin: 15px 0;
    border: none;
    border-top: 1px solid var(--acento-borde);
  }
  .bubble .table-scroll { overflow-x: auto; margin-top: 11px; }
  .bubble .table-scroll:first-child { margin-top: 0; }
  .bubble table {
    border-collapse: collapse;
    width: 100%;
    min-width: 320px;
    font-size: .92em;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--acento-borde);
    padding: 7px 11px;
    text-align: left;
    vertical-align: top;
  }
  .bubble thead th {
    background: var(--acento-fondo);
    font-weight: 700;
    color: var(--acento);
  }
  .bubble tbody tr:nth-child(even) td { background: var(--acento-tenue); }

  .pie-msg { display: flex; align-items: center; gap: 9px; padding: 0 6px; }
  .meta { font-size: 10.5px; font-weight: 500; color: var(--tinta-suave); }
  .copiar {
    font-family: var(--fuente);
    font-size: 10.5px;
    font-weight: 600;
    background: none;
    border: none;
    color: var(--morado);
    cursor: pointer;
    padding: 0;
    opacity: 0;
    transition: opacity .2s;
  }
  .msg:hover .copiar, .copiar:focus-visible { opacity: 1; }

  .fuentes-msg {
    margin: 2px 6px 0;
    font-size: 10.5px;
    color: var(--tinta-suave);
  }
  .fuentes-msg summary { cursor: pointer; font-weight: 500; }
  .fuentes-msg ul { margin: 6px 0 0; padding-left: 16px; }
  .fuentes-msg li { margin-top: 2px; }

  .typing {
    display: flex;
    gap: 5px;
    padding: 17px 22px;
    background: var(--burbuja-ia);
    border-radius: 20px 20px 20px 7px;
    width: fit-content;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--navy);
    animation: latir 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes latir { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ── Barra de redacción ─────────────────────────── */

  .composer {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 26px;
    background: var(--lavanda);
  }

  textarea#input {
    flex: 1;
    resize: none;
    max-height: 120px;
    font-family: var(--fuente);
    font-size: 14.5px;
    line-height: 1.5;
    padding: 15px 24px;
    border: none;
    border-radius: 999px;
    background: var(--blanco);
    color: var(--tinta);
    scrollbar-width: thin;
  }
  textarea#input::placeholder { color: #9A9CB3; }
  textarea#input:focus-visible { outline-offset: 1px; }

  .hueco-toto { flex: 0 0 132px; }

  .enviar {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: var(--navy);
    color: var(--blanco);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .18s, transform .18s;
  }
  .enviar:hover:not(:disabled) { background: var(--navy-oscuro); transform: translateY(-1px); }
  .enviar:disabled { opacity: .45; cursor: default; }

  /* ── Capa de TOTO ───────────────────────────────── */

  .toto {
    position: absolute;
    right: 18px;
    bottom: -14px;
    height: 68%;
    aspect-ratio: 430 / 744;
    pointer-events: none;
  }
  .toto img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: bottom center;
    filter: drop-shadow(0 16px 22px rgba(30, 42, 124, .22));
    opacity: 0;
    transition: opacity var(--fade, 800ms) ease;
  }
  .toto img.visible { opacity: 1; }

  /* ── Pantallas angostas ─────────────────────────── */

  @media (max-width: 880px) {
    body { padding: 0; background: var(--crema); }
    .card { height: 100vh; height: 100dvh; max-width: none; border-radius: 0; box-shadow: none; min-height: 0; }
    header { padding: 16px 18px 14px; }
    .marca { height: 44px; }
    .chips { padding: 14px 18px 4px; gap: 8px; flex-wrap: nowrap; overflow-x: auto; }
    .chip { white-space: nowrap; font-size: 12px; padding: 8px 15px; }
    .log { padding: 14px 18px 20px; padding-right: 128px; }
    .bubble { font-size: 14px; padding: 14px 18px; }
    .composer { padding: 14px 16px; gap: 10px; }
    .hueco-toto { flex-basis: 74px; }
    textarea#input { padding: 13px 18px; }
    .enviar { width: 46px; height: 46px; }
    .toto { height: 46%; right: 6px; }
    .copiar { opacity: 1; }
    .ajustes { padding: 14px 18px; }
    .fila { flex-wrap: wrap; }
  }

  @media (max-width: 560px) {
    .estado span:last-child { display: none; }
    .titulos h1 { font-size: 17px; }
    .titulos p { font-size: 10.5px; }
    .log { padding-right: 96px; }
    .toto { height: 38%; }
    .hueco-toto { flex-basis: 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .typing span { opacity: .6; }
  }
</style>
</head>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const log            = $('log');
  const input          = $('input');
  const sendBtn         = $('sendBtn');
  const statusDot       = $('statusDot');
  const statusSub       = $('statusSub');
  const agentNameLabel  = $('agentNameLabel');
  const settingsToggle  = $('settingsToggle');
  const settingsPanel   = $('settingsPanel');
  const apiBaseInput    = $('apiBaseInput');
  const saveSettings    = $('saveSettings');
  const sessionIdView   = $('sessionIdView');
  const newSessionBtn   = $('newSession');
  const promptsBar      = $('prompts');

  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function defaultApiBase() {
    if (location.protocol.startsWith('http') && location.hostname !== '' ) {
      // Si esta página se sirve desde el mismo backend, úsalo por defecto.
      // Si se abre como archivo local o desde otro origen, apunta a localhost:8000.
      return location.origin.includes('localhost') || location.origin.includes('127.0.0.1')
        ? location.origin.replace(/:\d+$/, ':8000')
        : location.origin;
    }
    return 'http://localhost:8000';
  }

  function newSessionId() {
    return 'web_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  }

  let apiBase   = store.get('agentApiBase', defaultApiBase());
  let sessionId = store.get('agentSessionId', newSessionId());
  store.set('agentSessionId', sessionId);

  apiBaseInput.value  = apiBase;
  sessionIdView.value = sessionId;

  // ── Presentación de las respuestas ──────────────────
  // Solo afecta cómo se dibuja el texto; no toca la conexión.

  function escapeHtml(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(t) {
    return t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function cellHtml(t) {
    return inline(t).replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  }

  function isPipeLine(line) {
    return line.length >= 2 && line.startsWith('|') && line.endsWith('|');
  }

  function splitRow(line) {
    return line.slice(1, -1).split('|').map(c => c.trim());
  }

  function isSeparatorRow(cells) {
    return cells.length > 0 && cells.every(c => /^:?-+:?$/.test(c));
  }

  function buildTable(headerCells, bodyRows) {
    let html = '<div class="table-scroll"><table><thead><tr>';
    for (const h of headerCells) html += '<th>' + cellHtml(h) + '</th>';
    html += '</tr></thead><tbody>';
    for (const row of bodyRows) {
      html += '<tr>';
      for (const cell of row) html += '<td>' + cellHtml(cell) + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
  }

  function renderRich(text) {
    const lines = escapeHtml(text).split('\n');
    let html = '', inList = false;
    let i = 0;

    while (i < lines.length) {
      const line = lines[i].trim();

      if (isPipeLine(line)) {
        const nextLine = i + 1 < lines.length ? lines[i + 1].trim() : '';
        const headerCells = splitRow(line);
        const sepCells = isPipeLine(nextLine) ? splitRow(nextLine) : null;

        if (sepCells && sepCells.length === headerCells.length && isSeparatorRow(sepCells)) {
          const bodyRows = [];
          let j = i + 2;
          while (j < lines.length && isPipeLine(lines[j].trim())) {
            bodyRows.push(splitRow(lines[j].trim()));
            j++;
          }
          if (inList) { html += '</ul>'; inList = false; }
          html += buildTable(headerCells, bodyRows);
          i = j;
          continue;
        }
        // No es una tabla válida: cae al renderizado normal de esta línea.
      }

      if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<hr>';
        i++;
        continue;
      }

      const bullet = line.match(/^[•\-\*]\s+(.*)$/);
      const heading = line.match(/^([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ0-9 ]{3,}):$/) || line.match(/^#{1,3}\s+(.*)$/);

      if (bullet) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inline(bullet[1]) + '</li>';
        i++;
        continue;
      }
      if (inList) { html += '</ul>'; inList = false; }

      if (heading)   html += '<h4>' + heading[1] + '</h4>';
      else if (line) html += '<p>' + inline(line) + '</p>';
      i++;
    }
    if (inList) html += '</ul>';
    return html || '<p></p>';
  }

  function addMessage(role, text, meta, fuentes) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'agent') bubble.innerHTML = renderRich(text);
    else                  bubble.textContent = text;
    wrap.appendChild(bubble);

    if (role === 'agent' || meta) {
      const foot = document.createElement('div');
      foot.className = 'pie-msg';

      if (meta) {
        const metaEl = document.createElement('span');
        metaEl.className = 'meta';
        metaEl.textContent = meta;
        foot.appendChild(metaEl);
      }

      if (role === 'agent') {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copiar';
        copyBtn.type = 'button';
        copyBtn.textContent = 'copiar';
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(text);
            copyBtn.textContent = 'copiado';
            setTimeout(() => { copyBtn.textContent = 'copiar'; }, 1600);
          } catch (e) {
            copyBtn.textContent = 'no se pudo copiar';
          }
        });
        foot.appendChild(copyBtn);
      }

      wrap.appendChild(foot);
    }

    if (role === 'agent' && fuentes && fuentes.length) {
      const det = document.createElement('details');
      det.className = 'fuentes-msg';
      const sum = document.createElement('summary');
      sum.textContent = fuentes.length + (fuentes.length === 1 ? ' documento consultado' : ' documentos consultados');
      det.appendChild(sum);
      const list = document.createElement('ul');
      for (const f of fuentes) {
        const li = document.createElement('li');
        li.textContent = f;
        list.appendChild(li);
      }
      det.appendChild(list);
      wrap.appendChild(det);
    }

    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';
    wrap.id = 'typingIndicator';
    const t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(t);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function hideTyping() {
    const el = $('typingIndicator');
    if (el) el.remove();
  }

  async function checkHealth() {
    try {
      const res = await fetch(apiBase + '/health/detail', { signal: AbortSignal.timeout(6000) });
      if (!res.ok) throw new Error('bad status');
      const data = await res.json();
      statusDot.className = 'online';
      agentNameLabel.textContent = data.agente || 'Asistente';
      statusSub.textContent = (data.proveedor || 'groq') + ' · ' + (data.modelo || 'modelo desconocido');
      return true;
    } catch (e) {
      statusDot.className = 'offline';
      statusSub.textContent = 'sin conexión — revisa la URL de la API';
      return false;
    }
  }

  async function sendMessage(text) {
    addMessage('user', text);
    input.value = '';
    autoResize();
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(apiBase + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: text, session_id: sessionId }),
      });

      hideTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addMessage('system', 'Error ' + res.status + ': ' + (err.detail || 'no se pudo procesar la solicitud.'));
        return;
      }

      const data = await res.json();
      const hora = new Date(data.timestamp || Date.now()).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
      const etiquetas = { conversacion: 'conversacion', documentos: 'rag/documentos', analisis: 'multiagente', reporte: 'estructurado' };
      const modo = etiquetas[data.categoria] || data.categoria || '';
      let metaTexto = hora + (modo ? ' · modo: ' + modo : '');
      addMessage('agent', data.respuesta, metaTexto, data.fuentes);
    } catch (e) {
      hideTyping();
      addMessage('system', 'No se pudo conectar con ' + apiBase + '. ¿Está el servidor corriendo?');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }

  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = input.value.trim();
      if (text) sendMessage(text);
    }
  });

  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (text) sendMessage(text);
  });

  promptsBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    sendMessage(btn.dataset.prompt);
  });

  settingsToggle.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
  });

  saveSettings.addEventListener('click', () => {
    const val = apiBaseInput.value.trim().replace(/\/$/, '');
    if (val) {
      apiBase = val;
      store.set('agentApiBase', apiBase);
      checkHealth();
      addMessage('system', 'URL de la API actualizada a ' + apiBase);
    }
  });

  newSessionBtn.addEventListener('click', () => {
    sessionId = newSessionId();
    store.set('agentSessionId', sessionId);
    sessionIdView.value = sessionId;
    log.innerHTML = '';
    addMessage('system', 'Nueva conversación iniciada — la memoria previa quedó fuera de esta sesión.');
  });

  // ── Estado inicial ──────────────────────────────────
  addMessage('agent',
    '¡Hola! Soy TOTO, asistente virtual especializado en el área pedagógica para ayudar a los docentes en la construcción de las aulas virtuales.\n\n' +
    'He sido entrenado con información específica sobre:\n\n' +
    '• Campus Virtual Santoto Bucaramanga\n' +
    '• Procedimientos académicos para las aulas virtuales\n' +
    '• Asesoría en la construcción de insumos\n' +
    '• Entre otros temas pedagógicos\n\n\n' +
    '¿En qué puedo ayudarte hoy?');
  checkHealth();
  input.focus();
})();
</script>

  };

  const caja = document.getElementById('avatar');
  const capas = [document.getElementById('avatarA'),
                 document.getElementById('avatarB')];
  if (!caja || capas.some(c => !c)) return;

  const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  caja.style.setProperty('--fade', (sinMovimiento ? 0 : AVATAR.fundido) + 'ms');

  // Descarta las rutas que no cargan, para no dejar huecos en blanco.
  function verificar(rutas) {
    return Promise.all(rutas.map(src => new Promise(ok => {
      const img = new Image();
      img.onload  = () => ok(src);
      img.onerror = () => ok(null);
      img.src = src;
    }))).then(r => r.filter(Boolean));
  }

  let disponibles = [], i = 0, activa = 0, reloj = null, pausada = false;

  function mostrar(src) {
    const entra = capas[1 - activa];
    if (entra.getAttribute('src') === src) return;
    entra.src = src;
    entra.classList.add('visible');
    capas[activa].classList.remove('visible');
    activa = 1 - activa;
  }

  function avanzar() {
    if (pausada || disponibles.length < 2) return;
    i = (i + 1) % disponibles.length;
    mostrar(disponibles[i]);
  }

  function arrancar() {
    detener();
    if (disponibles.length > 1) reloj = setInterval(avanzar, AVATAR.intervalo);
  }
  function detener() {
    if (reloj) { clearInterval(reloj); reloj = null; }
  }

  // No consume recursos con la pestaña en segundo plano.
  document.addEventListener('visibilitychange', () => {
    document.hidden ? detener() : arrancar();
  });

  // Pose de "pensando": se activa observando el indicador de
  // escritura que ya inserta el chat, sin modificar su código.
  if (AVATAR.alPensar) {
    const log = document.getElementById('log');
    if (log) {
      const observador = new MutationObserver(() => {
        const pensando = !!document.getElementById('typingIndicator');
        if (pensando && !pausada) {
          pausada = true;
          detener();
          mostrar(AVATAR.alPensar);
        } else if (!pensando && pausada) {
          pausada = false;
          mostrar(disponibles[i] || AVATAR.imagenes[0]);
          arrancar();
        }
      });
      observador.observe(log, { childList: true });
    }
  }

  const lista = AVATAR.alPensar
    ? AVATAR.imagenes.concat(AVATAR.alPensar)
    : AVATAR.imagenes.slice();

  verificar(lista).then(ok => {
    disponibles = ok.filter(s => s !== AVATAR.alPensar);
    if (!disponibles.length) return;      // conserva la imagen del HTML
    mostrar(disponibles[0]);
    arrancar();
  });

})();
