<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOTO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #080c16;
    --bg-glow-cyan: rgba(56, 189, 248, .16);
    --bg-glow-gold: rgba(212, 175, 55, .10);
    --surface: rgba(19, 27, 46, .82);
    --surface-solid: #121a2c;
    --surface-2: rgba(255, 255, 255, .04);
    --border-soft: rgba(255, 255, 255, .09);
    --text: #f3f5fb;
    --text-muted: #93a0bd;
    --metal-1: #f8ecc4;
    --metal-2: #d4af37;
    --metal-3: #7a5a1e;
    --accent: #d4af37;
    --accent-ink: #241a05;
    --cyan: #45c6f6;
    --ok: #3ddc97;
    --danger: #f2685c;
    --danger-soft: rgba(242, 104, 92, .12);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(760px 420px at 14% -6%, var(--bg-glow-cyan), transparent 60%),
      radial-gradient(640px 500px at 100% 18%, var(--bg-glow-gold), transparent 65%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    display: flex;
    justify-content: center;
    padding: clamp(14px, 3.4vw, 44px);
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 1080px;
    height: calc(100vh - clamp(28px, 6.8vw, 88px));
    min-height: 580px;
    display: grid;
    grid-template-columns: 268px 1fr;
    gap: 18px;
  }

  /* ── Riel de identidad ───────────────────────────── */

  .rail {
    position: relative;
    overflow: hidden;
    padding: 26px 20px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background:
      linear-gradient(var(--surface-solid), var(--surface-solid)) padding-box,
      linear-gradient(155deg, var(--metal-1), var(--metal-2) 32%, var(--metal-3) 52%, var(--metal-1) 78%, var(--metal-2)) border-box;
    border: 1.4px solid transparent;
    border-radius: var(--radius-lg);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .65);
  }

  /* halo frío detrás del escudo */
  .rail::before {
    content: '';
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 184px;
    height: 184px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(69, 198, 246, .18), transparent 68%);
  }

  .crest {
    position: relative;
    width: 108px;
    height: 108px;
    margin-bottom: 4px;
    filter: drop-shadow(0 5px 14px rgba(0, 0, 0, .45));
  }

  .avatar {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
  }
  .avatar img {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 100%;
    max-height: 372px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 18px 26px rgba(0, 0, 0, .5));
    opacity: 0;
    transition: opacity var(--fade, 700ms) ease;
  }
  .avatar img.visible { opacity: 1; }

  .wordmark {
    position: relative;
    text-align: center;
    margin-top: 16px;
  }
  .wordmark h1 {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    letter-spacing: .02em;
    background: linear-gradient(120deg, var(--metal-1), var(--metal-2) 55%, var(--metal-1));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .wordmark p {
    margin: 7px 0 0;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .08em;
    color: var(--text-muted);
  }

  .presence {
    position: relative;
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: 100%;
  }
  .presence .sub {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .03em;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: background .3s, box-shadow .3s;
  }
  .status-dot.online { background: var(--ok); box-shadow: 0 0 0 4px rgba(61, 220, 151, .18), 0 0 10px rgba(61, 220, 151, .5); }
  .status-dot.offline { background: var(--danger); box-shadow: 0 0 0 4px rgba(242, 104, 92, .16); }

  /* ── Consola de conversación ─────────────────────── */

  .console {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background:
      linear-gradient(var(--surface-solid), var(--surface-solid)) padding-box,
      linear-gradient(155deg, var(--metal-1), var(--metal-2) 32%, var(--metal-3) 52%, var(--metal-1) 78%, var(--metal-2)) border-box;
    border: 1.4px solid transparent;
    border-radius: var(--radius-lg);
    box-shadow:
      0 30px 60px -20px rgba(0, 0, 0, .65),
      0 2px 24px rgba(212, 175, 55, .08);
  }

  header {
    position: relative;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px 20px;
    min-height: 84px;
    border-bottom: 1px solid var(--border-soft);
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
  }

  header::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background: url('/static/campus-logo.webp') no-repeat center center;
    background-size: contain;
    opacity: 0.15;
    pointer-events: none;
  }

  .header-title {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .header-title .name {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: .01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .header-title .hint {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--text-muted);
  }

  header .spacer { flex: 1; }
  header .icon-btn { position: relative; z-index: 1; }

  /* ── Marca de agua ───────────────────────────────── */

  .log-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
  }
  .log-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('/static/log-watermark.webp') center / min(46%, 290px) no-repeat;
    opacity: .05;
    pointer-events: none;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--surface-2);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    flex-shrink: 0;
    transition: border-color .2s, color .2s;
  }
  .icon-btn:hover { border-color: var(--metal-2); color: var(--metal-1); }
  .icon-btn:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ── Ajustes ─────────────────────────────────────── */

  .settings {
    border-bottom: 1px solid var(--border-soft);
    background: rgba(0, 0, 0, .18);
    padding: 16px 20px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .settings.open { display: flex; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .08em;
    color: var(--text-muted);
  }
  .field input {
    font-family: var(--font-mono);
    font-size: 12.5px;
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: rgba(0, 0, 0, .25);
    color: var(--text);
  }
  .field input:read-only { color: var(--text-muted); }

  .settings-row { display: flex; gap: 10px; align-items: flex-end; }
  .settings-row .field { flex: 1; min-width: 0; }

  .btn {
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 500;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .2s;
  }
  .btn:hover { border-color: var(--metal-2); }
  .btn.ghost-danger { color: var(--danger); }
  .btn.ghost-danger:hover { border-color: var(--danger); }

  /* ── Hilo de mensajes ────────────────────────────── */

  .log {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-soft) transparent;
  }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 4px; }

  .msg { display: flex; flex-direction: column; gap: 5px; max-width: 84%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .msg.system { align-self: center; max-width: 100%; align-items: center; }

  .msg .role {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .08em;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, var(--metal-1), var(--metal-2) 65%);
    color: var(--accent-ink);
    font-weight: 500;
    padding: 11px 16px;
    border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md);
    font-size: 14px;
    line-height: 1.55;
    box-shadow: 0 6px 16px -6px rgba(212, 175, 55, .45);
  }

  .msg.agent .bubble {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    padding: 12px 16px;
    border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
    font-size: 14px;
    line-height: 1.65;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    overflow-wrap: anywhere;
  }

  .msg.system .bubble {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--danger);
    background: var(--danger-soft);
    border: 1px solid rgba(242, 104, 92, .28);
    padding: 9px 14px;
    border-radius: var(--radius-sm);
  }

  /* formato ligero dentro de las respuestas del agente */
  .bubble p { margin: 0; }
  .bubble p + p, .bubble ul { margin-top: 10px; }
  .bubble h4 {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--metal-2);
  }
  .bubble h4:first-child { margin-top: 0; }
  .bubble ul { margin-bottom: 0; padding-left: 2px; list-style: none; }
  .bubble ul li { position: relative; padding-left: 17px; margin-top: 5px; }
  .bubble ul li::before {
    content: '';
    position: absolute;
    left: 2px;
    top: 10px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--metal-2);
  }
  .bubble ol { margin-top: 10px; margin-bottom: 0; padding-left: 20px; list-style: none; counter-reset: bubble-ol; }
  .bubble ol li { position: relative; padding-left: 4px; margin-top: 5px; counter-increment: bubble-ol; }
  .bubble ol li::before {
    content: counter(bubble-ol) '.';
    position: absolute;
    left: -20px;
    color: var(--metal-2);
    font-family: var(--font-mono);
    font-size: .85em;
  }
  .bubble blockquote {
    margin: 10px 0 0;
    padding: 8px 12px;
    border-left: 2px solid var(--metal-2);
    background: var(--surface-2);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    color: var(--text-muted);
    font-style: italic;
  }
  .bubble em { color: var(--text-muted); }
  .bubble code {
    font-family: var(--font-mono);
    font-size: .88em;
    background: rgba(0, 0, 0, .32);
    padding: 2px 6px;
    border-radius: 5px;
  }
  .bubble strong { color: var(--metal-1); font-weight: 600; }

  .foot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
  }
  .copy {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .05em;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    opacity: 0;
    transition: opacity .2s, color .2s;
  }
  .msg:hover .copy, .copy:focus-visible { opacity: 1; }
  .copy:hover { color: var(--metal-2); }

  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 15px;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
    width: fit-content;
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--metal-2);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ── Sugerencias y redacción ─────────────────────── */

  .prompts {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    padding: 0 20px 16px;
  }
  .chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border-soft);
    background: var(--surface-2);
    color: var(--text-muted);
    cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .chip:hover { border-color: var(--metal-2); color: var(--metal-1); }

  .composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 16px 18px;
    border-top: 1px solid var(--border-soft);
    background: linear-gradient(0deg, rgba(255,255,255,.03), transparent);
  }

  .prompt-mark {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    color: var(--metal-2);
    font-size: 19px;
    line-height: 1;
    padding-bottom: 12px;
  }

  textarea#input {
    flex: 1;
    resize: none;
    max-height: 140px;
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    padding: 11px 16px;
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    background: rgba(0, 0, 0, .22);
    color: var(--text);
    caret-color: var(--metal-2);
    scrollbar-width: thin;
    scrollbar-color: var(--border-soft) transparent;
  }
  textarea#input:focus-visible { outline-offset: 0; border-color: var(--metal-2); }
  textarea#input::-webkit-scrollbar { width: 6px; }
  textarea#input::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 3px; }

  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.2);
    background: linear-gradient(155deg, var(--metal-1), var(--metal-2) 60%, var(--metal-3));
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 6px 16px -6px rgba(212, 175, 55, .55), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .15s, filter .15s;
  }
  .send-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .send-btn:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }

  /* ── Pantallas angostas ──────────────────────────── */

  @media (max-width: 860px) {
    body { padding: 0; }
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      gap: 0;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      max-width: none;
    }
    .rail {
      flex-direction: row;
      align-items: center;
      gap: 14px;
      padding: 11px 16px;
      border-radius: 0;
      border-width: 0 0 1.4px;
      box-shadow: none;
    }
    .rail::before { top: 50%; left: 74px; transform: translate(-50%, -50%); width: 92px; height: 92px; }
    .crest { width: 42px; height: 42px; margin-bottom: 0; flex: 0 0 auto; }
    .avatar { flex: 0 0 62px; height: 68px; }
    .avatar img { max-height: 68px; top: 50%; bottom: auto; transform: translate(-50%, -50%); }
    .log-wrap::before { background-size: min(58%, 200px); }
    .wordmark { margin-top: 0; text-align: left; flex: 1; min-width: 0; }
    .wordmark h1 { font-size: 26px; }
    .wordmark p { display: none; }
    .presence { margin-top: 3px; }
    .console { border-radius: 0; border-width: 0; box-shadow: none; }
    .msg { max-width: 92%; }
    .prompts { flex-wrap: nowrap; overflow-x: auto; }
    .chip { white-space: nowrap; }
    .copy { opacity: 1; }
  }

  @media (max-width: 520px) {
    header::before { display: none; }
    .header-title .hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .typing span { opacity: .6; }
  }
</style>
</head>
<body>

<main class="app">

  <aside class="rail">
    <img class="crest" src="/static/crest.webp" alt="Escudo de la Universidad Santo Tomás">
    <div class="avatar" id="avatar">
      <img id="avatarA" class="visible" src="/static/avatar-pose-1.webp" alt="TOTO, el asistente virtual de la maestría">
      <img id="avatarB" alt="" aria-hidden="true">
    </div>
    <div class="wordmark">
      <h1>TOTO</h1>
      <p>By Ingenieras Heidy Leon y Sayra Garzon</p>
    </div>
    <div class="presence">
      <span class="status-dot" id="statusDot"></span>
      <span class="sub" id="statusSub">conectando…</span>
    </div>
  </aside>

  <section class="console">
    <header>
      <div class="header-title">
        <span class="name" id="agentNameLabel">Asistente</span>
        <span class="hint">Enter envía · Shift+Enter salta línea</span>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="settingsToggle" title="Configuración" aria-label="Configuración">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </header>

    <div class="settings" id="settingsPanel">
      <div class="settings-row">
        <div class="field">
          <label for="apiBaseInput">URL de la API</label>
          <input id="apiBaseInput" type="text" placeholder="http://localhost:8000" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn" id="saveSettings">Guardar</button>
      </div>
      <div class="settings-row">
        <div class="field">
          <label for="sessionIdView">Sesión activa</label>
          <input id="sessionIdView" type="text" readonly>
        </div>
        <button class="btn ghost-danger" id="newSession">Nueva conversación</button>
      </div>
    </div>

    <div class="log-wrap">
      <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversación con TOTO"></div>
    </div>

    <div class="prompts" id="prompts">
      <button class="chip" data-prompt="¿Cómo redacto un resultado de aprendizaje para mi asignatura?">redactar un RA</button>
      <button class="chip" data-prompt="Ayúdame a construir una rúbrica para una actividad evaluativa">crear una rúbrica</button>
      <button class="chip" data-prompt="¿Qué estrategias didácticas puedo usar en un aula virtual?">estrategias didácticas</button>
      <button class="chip" data-prompt="¿Cuál es el proceso para la apertura de un aula virtual?">apertura de aula</button>
    </div>

    <div class="composer">
      <span class="prompt-mark">&gt;</span>
      <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" autocomplete="off" aria-label="Mensaje para TOTO"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Enviar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 20L20 12L4 4V10L14 12L4 14V20Z" fill="currentColor"/></svg>
      </button>
    </div>
  </section>

</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const log            = $('log');
  const input          = $('input');
  const sendBtn         = $('sendBtn');
  const statusDot       = $('statusDot');
  const statusSub       = $('statusSub');
  const agentNameLabel  = $('agentNameLabel');
  const settingsToggle  = $('settingsToggle');
  const settingsPanel   = $('settingsPanel');
  const apiBaseInput    = $('apiBaseInput');
  const saveSettings    = $('saveSettings');
  const sessionIdView   = $('sessionIdView');
  const newSessionBtn   = $('newSession');
  const promptsBar      = $('prompts');

  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function defaultApiBase() {
    if (location.protocol.startsWith('http') && location.hostname !== '' ) {
      // Si esta página se sirve desde el mismo backend, úsalo por defecto.
      // Si se abre como archivo local o desde otro origen, apunta a localhost:8000.
      return location.origin.includes('localhost') || location.origin.includes('127.0.0.1')
        ? location.origin.replace(/:\d+$/, ':8000')
        : location.origin;
    }
    return 'http://localhost:8000';
  }

  function newSessionId() {
    return 'web_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  }

  let apiBase   = store.get('agentApiBase', defaultApiBase());
  let sessionId = store.get('agentSessionId', newSessionId());
  store.set('agentSessionId', sessionId);

  apiBaseInput.value  = apiBase;
  sessionIdView.value = sessionId;

  // ── Presentación de las respuestas ──────────────────
  // Solo afecta cómo se dibuja el texto; no toca la conexión.

  function escapeHtml(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(t) {
    return t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function renderRich(text) {
    const lines = escapeHtml(text).split('\n');
    let html = '', inList = false, inOrderedList = false;

    for (const raw of lines) {
      const line = raw.trim();
      const bullet = line.match(/^[•\-\*]\s+(.*)$/);
      const numbered = line.match(/^\d+\.\s+(.*)$/);
      const quote = line.match(/^&gt;\s?(.*)$/);
      const heading = line.match(/^([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ0-9 ]{3,}):$/) || line.match(/^#{1,3}\s+(.*)$/);

      if (bullet) {
        if (inOrderedList) { html += '</ol>'; inOrderedList = false; }
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inline(bullet[1]) + '</li>';
        continue;
      }
      if (numbered) {
        if (inList) { html += '</ul>'; inList = false; }
        if (!inOrderedList) { html += '<ol>'; inOrderedList = true; }
        html += '<li>' + inline(numbered[1]) + '</li>';
        continue;
      }
      if (inList) { html += '</ul>'; inList = false; }
      if (inOrderedList) { html += '</ol>'; inOrderedList = false; }

      if (quote)     html += '<blockquote>' + inline(quote[1]) + '</blockquote>';
      else if (heading) html += '<h4>' + heading[1] + '</h4>';
      else if (line) html += '<p>' + inline(line) + '</p>';
    }
    if (inList) html += '</ul>';
    if (inOrderedList) html += '</ol>';
    return html || '<p></p>';
  }

  function addMessage(role, text, meta) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    const roleLabel = document.createElement('div');
    roleLabel.className = 'role';
    roleLabel.textContent = role === 'user' ? 'tú' : role === 'agent' ? agentNameLabel.textContent : 'sistema';
    if (role !== 'system') wrap.appendChild(roleLabel);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'agent') bubble.innerHTML = renderRich(text);
    else                  bubble.textContent = text;
    wrap.appendChild(bubble);

    if (role === 'agent' || meta) {
      const foot = document.createElement('div');
      foot.className = 'foot';

      if (meta) {
        const metaEl = document.createElement('span');
        metaEl.className = 'meta';
        metaEl.textContent = meta;
        foot.appendChild(metaEl);
      }

      if (role === 'agent') {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy';
        copyBtn.type = 'button';
        copyBtn.textContent = 'copiar';
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(text);
            copyBtn.textContent = 'copiado';
            setTimeout(() => { copyBtn.textContent = 'copiar'; }, 1600);
          } catch (e) {
            copyBtn.textContent = 'no se pudo copiar';
          }
        });
        foot.appendChild(copyBtn);
      }

      wrap.appendChild(foot);
    }

    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg agent';
    wrap.id = 'typingIndicator';
    const t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(t);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function hideTyping() {
    const el = $('typingIndicator');
    if (el) el.remove();
  }

  async function checkHealth() {
    try {
      const res = await fetch(apiBase + '/health/detail', { signal: AbortSignal.timeout(6000) });
      if (!res.ok) throw new Error('bad status');
      const data = await res.json();
      statusDot.className = 'status-dot online';
      agentNameLabel.textContent = data.agente || 'Asistente';
      statusSub.textContent = (data.proveedor || 'groq') + ' · ' + (data.modelo || 'modelo desconocido');
      return true;
    } catch (e) {
      statusDot.className = 'status-dot offline';
      statusSub.textContent = 'sin conexión — revisa la URL de la API';
      return false;
    }
  }

  async function sendMessage(text) {
    addMessage('user', text);
    input.value = '';
    autoResize();
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(apiBase + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: text, session_id: sessionId }),
      });

      hideTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addMessage('system', 'Error ' + res.status + ': ' + (err.detail || 'no se pudo procesar la solicitud.'));
        return;
      }

      const data = await res.json();
      const hora = new Date(data.timestamp || Date.now()).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
      const etiquetas = { conversacion: 'conversacion', documentos: 'rag/documentos', analisis: 'multiagente', reporte: 'estructurado' };
      const modo = etiquetas[data.categoria] || data.categoria || '';
      let metaTexto = hora + (modo ? ' · modo: ' + modo : '');
      if (data.fuentes && data.fuentes.length) metaTexto += ' · fuentes: ' + data.fuentes.join(', ');
      addMessage('agent', data.respuesta, metaTexto);
    } catch (e) {
      hideTyping();
      addMessage('system', 'No se pudo conectar con ' + apiBase + '. ¿Está el servidor corriendo?');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }

  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = input.value.trim();
      if (text) sendMessage(text);
    }
  });

  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (text) sendMessage(text);
  });

  promptsBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    sendMessage(btn.dataset.prompt);
  });

  settingsToggle.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
  });

  saveSettings.addEventListener('click', () => {
    const val = apiBaseInput.value.trim().replace(/\/$/, '');
    if (val) {
      apiBase = val;
      store.set('agentApiBase', apiBase);
      checkHealth();
      addMessage('system', 'URL de la API actualizada a ' + apiBase);
    }
  });

  newSessionBtn.addEventListener('click', () => {
    sessionId = newSessionId();
    store.set('agentSessionId', sessionId);
    sessionIdView.value = sessionId;
    log.innerHTML = '';
    addMessage('system', 'Nueva conversación iniciada — la memoria previa quedó fuera de esta sesión.');
  });

  // ── Estado inicial ──────────────────────────────────
  addMessage('agent', 'Hola, soy TOTO. Acompaño a los docentes de la Universidad Santo Tomás, seccional Bucaramanga, en la construcción de sus aulas virtuales: competencias y resultados de aprendizaje, actividades evaluativas, rúbricas, estrategias didácticas y los procedimientos del Campus Virtual. Trabajo con la documentación institucional y te indico de qué documento sale cada cosa; si algo no está ahí, te lo digo en vez de improvisar. Cuéntame en qué estás trabajando y avanzamos juntos.');
  checkHealth();
  input.focus();
})();
</script>

<script>
/* ══════════════════════════════════════════════════════
   Rotación de imágenes de TOTO
   Bloque independiente: no toca la conexión ni el chat.
   ══════════════════════════════════════════════════════ */
(function () {

  /* ── AJUSTA AQUÍ ────────────────────────────────────
     imagenes  : rutas de las poses de TOTO, en orden.
                 Con una sola, no rota. Las que no existan
                 se descartan solas.
     intervalo : milisegundos entre cambios (8000 = 8 s).
     fundido   : duración del desvanecido en milisegundos.
     alPensar  : ruta de una pose que se muestra mientras
                 TOTO responde. Deja null para desactivarlo.
  ─────────────────────────────────────────────────────── */
  const AVATAR = {
    imagenes: [
      '/static/avatar-pose-1.webp',
      '/static/avatar-pose-2.webp',
      '/static/avatar-pose-3.webp'
    ],
    intervalo: 9000,
    fundido:   800,
    alPensar:  '/static/avatar-pensar.webp'
  };

  const caja = document.getElementById('avatar');
  const capas = [document.getElementById('avatarA'),
                 document.getElementById('avatarB')];
  if (!caja || capas.some(c => !c)) return;

  const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  caja.style.setProperty('--fade', (sinMovimiento ? 0 : AVATAR.fundido) + 'ms');

  // Descarta las rutas que no cargan, para no dejar huecos en blanco.
  function verificar(rutas) {
    return Promise.all(rutas.map(src => new Promise(ok => {
      const img = new Image();
      img.onload  = () => ok(src);
      img.onerror = () => ok(null);
      img.src = src;
    }))).then(r => r.filter(Boolean));
  }

  let disponibles = [], i = 0, activa = 0, reloj = null, pausada = false;

  function mostrar(src) {
    const entra = capas[1 - activa];
    if (entra.getAttribute('src') === src) return;
    entra.src = src;
    entra.classList.add('visible');
    capas[activa].classList.remove('visible');
    activa = 1 - activa;
  }

  function avanzar() {
    if (pausada || disponibles.length < 2) return;
    i = (i + 1) % disponibles.length;
    mostrar(disponibles[i]);
  }

  function arrancar() {
    detener();
    if (disponibles.length > 1) reloj = setInterval(avanzar, AVATAR.intervalo);
  }
  function detener() {
    if (reloj) { clearInterval(reloj); reloj = null; }
  }

  // No consume recursos con la pestaña en segundo plano.
  document.addEventListener('visibilitychange', () => {
    document.hidden ? detener() : arrancar();
  });

  // Pose de "pensando": se activa observando el indicador de
  // escritura que ya inserta el chat, sin modificar su código.
  if (AVATAR.alPensar) {
    const log = document.getElementById('log');
    if (log) {
      const observador = new MutationObserver(() => {
        const pensando = !!document.getElementById('typingIndicator');
        if (pensando && !pausada) {
          pausada = true;
          detener();
          mostrar(AVATAR.alPensar);
        } else if (!pensando && pausada) {
          pausada = false;
          mostrar(disponibles[i] || AVATAR.imagenes[0]);
          arrancar();
        }
      });
      observador.observe(log, { childList: true });
    }
  }

  const lista = AVATAR.alPensar
    ? AVATAR.imagenes.concat(AVATAR.alPensar)
    : AVATAR.imagenes.slice();

  verificar(lista).then(ok => {
    disponibles = ok.filter(s => s !== AVATAR.alPensar);
    if (!disponibles.length) return;      // conserva la imagen del HTML
    mostrar(disponibles[0]);
    arrancar();
  });

})();
</script>
